name: CI

on:
  push: { branches: [main] }
  pull_request:

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7          # vendor/cua (the upstream submodule) is only needed to re-export
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:lib
      # schema, collation and extraction parity against Python's output, and the ONNX graph against PyTorch
      - run: npm test
